name: Diagnose public course media
on:
  push:
    branches: [online-public-courses]
    paths: ['.github/workflows/probe-online-media.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous course and media access without saving audio
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, quote
          from urllib.error import HTTPError
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlencode
          from collections import Counter

          headers = {"x-app-platform": "ios", "x-app-version": "1.0.40"}
          def get_json(url):
              with urlopen(Request(url, headers=headers), timeout=20) as response:
                  return json.load(response)

          results = []
          for origin in ["https://www.echo-loop.cn", "https://www.echo-loop.top"]:
              result = {"api_origin": origin}
              try:
                  catalog = get_json(origin + "/api/v2/collections")
                  entry = next(item for item in catalog["items"] if item["name"].startswith("A1"))
                  prefix = origin + "/api/v2/collections/" + quote(entry["id"], safe="")
                  collection = get_json(prefix)
                  file = collection["items"][0]
                  detail = get_json(prefix + "/files/" + quote(file["id"], safe=""))
                  media = detail["file"]["mediaUrl"]
                  parsed = urlparse(media)
                  if parsed.scheme != "https" or not parsed.hostname or parsed.username:
                      raise ValueError("invalid_public_media_url")
                  result.update(collection=entry["name"], file=file["title"],
                      sentence_count=len(detail["subtitle"]["sentences"]),
                      media_origin="https://" + parsed.netloc)
                  # 比较正常GET和Range GET；每次仅消费一个字节并关闭连接，不保存音频。
                  attempts = []
                  candidates = [("normal_get", media, {}), ("range_get", media, {"Range": "bytes=0-0"})]
                  # 已配置的中国CDN是否也公开提供同一路径；只读验证，不假定可以替换。
                  if parsed.hostname == "cdn.echo-loop.top":
                      china_media = parsed._replace(netloc="cdn.echo-loop.cn").geturl()
                      candidates.append(("configured_china_cdn", china_media, {}))
                  for label, media_candidate, request_headers in candidates:
                      probe = {"request": label}
                      try:
                          with urlopen(Request(media_candidate, headers=request_headers), timeout=20) as response:
                              response.read(1)
                              probe.update(status=response.status, content_type=response.headers.get("Content-Type"))
                      except HTTPError as error:
                          probe["status"] = error.code
                          # 仅记录XML错误代码，避免日志泄露临时媒体URL或签名参数。
                          body = error.read(2048)
                          try:
                              root = ET.fromstring(body)
                              probe["error_code"] = root.findtext("Code")
                          except ET.ParseError:
                              pass
                      except Exception as error:
                          probe["error_type"] = type(error).__name__
                      attempts.append(probe)
                  result["media_attempts"] = attempts
              except Exception as error:
                  result.update(error_type=type(error).__name__, status=getattr(error, "code", None))
              results.append(result)
          print(json.dumps(results, ensure_ascii=False))

          # 分页核对A1/A2所有已发布媒体，只发送HEAD，不保存课程文件。
          origin = "https://www.echo-loop.cn"
          catalog = get_json(origin + "/api/v2/collections")
          course_results = []
          for entry in catalog["items"]:
              if not entry["name"].startswith(("A1-", "A2-")):
                  continue
              prefix = origin + "/api/v2/collections/" + quote(entry["id"], safe="")
              files, cursor, seen = [], None, set()
              for page_index in range(20):
                  page = get_json(prefix + ("?" + urlencode({"cursor": cursor}) if cursor else ""))
                  files.extend(page["items"])
                  cursor = page.get("nextCursor")
                  if not cursor:
                      break
                  if cursor in seen:
                      raise ValueError("repeated_cursor")
                  seen.add(cursor)
              def check(file):
                  parsed = urlparse(file["mediaUrl"])
                  if parsed.scheme != "https" or not parsed.hostname or parsed.username:
                      return {"title": file["title"], "status": "invalid_url"}
                  if parsed.hostname == "cdn.echo-loop.top":
                      parsed = parsed._replace(netloc="cdn.echo-loop.cn")
                  try:
                      with urlopen(Request(parsed.geturl(), method="HEAD"), timeout=20) as response:
                          return {"title": file["title"], "status": response.status,
                              "content_type": response.headers.get("Content-Type")}
                  except HTTPError as error:
                      return {"title": file["title"], "status": error.code}
                  except Exception as error:
                      return {"title": file["title"], "status": type(error).__name__}
              with ThreadPoolExecutor(max_workers=4) as pool:
                  checks = list(pool.map(check, files))
              course_results.append({"collection": entry["name"],
                  "catalog_file_count": entry["fileCount"], "checked_files": len(checks),
                  "status_counts": dict(Counter(str(item["status"]) for item in checks)),
                  "failures": [item for item in checks if item["status"] != 200]})
          print("A1_A2_MEDIA_CHECK " + json.dumps(course_results, ensure_ascii=False))

          PY
