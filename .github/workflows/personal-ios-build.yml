name: Personal iPhone build

on:
  workflow_dispatch:
  push:
    branches: [personal-courses]
    paths:
      - 'lib/data/personal_courses.dart'
      - 'lib/services/personal_course_installer.dart'
      - 'lib/providers/sentence_ai_provider.dart'
      - 'lib/providers/startup_bootstrap_provider.dart'
      - 'scripts/generate_personal_courses.py'
      - 'test/providers/personal_translation_test.dart'
      - 'test/services/personal_course_installer_test.dart'
      - '.github/workflows/personal-ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Record build environment
        run: |
          mkdir -p personal-build
          git rev-parse HEAD > personal-build/source-commit.txt
          flutter --version > personal-build/flutter-version.txt
          xcodebuild -version > personal-build/xcode-version.txt

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate personal course audio
        run: python3 scripts/generate_personal_courses.py

      - name: Check personal course changes
        run: |
          flutter analyze lib/data/personal_courses.dart lib/services/personal_course_installer.dart lib/providers/sentence_ai_provider.dart lib/providers/startup_bootstrap_provider.dart test/providers/personal_translation_test.dart test/services/personal_course_installer_test.dart
          flutter test test/providers/personal_translation_test.dart test/services/personal_course_installer_test.dart test/providers/sentence_ai_provider_test.dart

      - name: Install locked iOS dependencies
        working-directory: ios
        run: |
          gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install

      - name: Compile for iPhone
        run: flutter build ios --release --no-codesign --flavor prod --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p personal-build/staging/Payload
          ditto build/ios/iphoneos/Runner.app personal-build/staging/Payload/Runner.app
          ditto -c -k --keepParent personal-build/staging/Payload personal-build/EchoLoop-Personal-unsigned.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('personal-build/EchoLoop-Personal-unsigned.ipa') as ipa:
              names = ipa.namelist()
              assert 'Payload/Runner.app/Info.plist' in names
              assert all(not name.startswith('/') and '..' not in name.split('/') for name in names)
          PY
          cp pubspec.lock personal-build/pubspec.lock
          cp ios/Podfile.lock personal-build/Podfile.lock
          printf '%s\n' 'Unsigned IPA: sign with Sideloadly for your own device before installation. This archive is not directly installable.' > personal-build/README.txt
          shasum -a 256 personal-build/*.ipa > personal-build/sha256.txt

      - name: Save installation package
        uses: actions/upload-artifact@v4
        with:
          name: EchoLoop-Personal-unsigned
          path: |
            personal-build/*.ipa
            personal-build/*.txt
            personal-build/*.lock
          if-no-files-found: error
          retention-days: 7

      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Personal-iPhone-build-diagnostics
          path: personal-build/*.txt
          if-no-files-found: warn
          retention-days: 7
